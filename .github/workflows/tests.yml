name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl and lxml
        run: pip install openpyxl lxml

      - name: Run the calculator test suite
        working-directory: st-calculator
        run: node tests/test_page.js

      - name: Validate the generated Excel workbook
        working-directory: st-calculator
        run: python tests/accept_xlsx.py
